# Site Configuration for aiops-infra
# ====================================
#
# Automatic setup (recommended for RHOAI team):
#   If you have `gh` access to red-hat-data-services/rhods-devops-infra,
#   the team's config is fetched automatically. No manual setup needed.
#   Run `python3 scripts/site_config.py --show-source` to verify.
#   Run `python3 scripts/site_config.py --refresh` to force a re-fetch.
#
# Tenant-based setup (recommended for discovery):
#   Set `tenant` below and `gitlab.host`. The system auto-discovers cluster_domain,
#   policy paths, and RPA directories from the konflux-release-data GitLab repo.
#   Steps:
#     1. Fill in gitlab.host and tenant below
#     2. Run: python3 scripts/site_config.py --check-connectivity
#     3. Run: python3 scripts/tenant_discovery.py --tenant <name> --human
#
# Manual setup (for custom or offline use):
#   Copy this file to ~/.config/aiops-infra/site-config.yaml and fill in values.
#   Local config always takes precedence over the remote config.
#
# Other options:
#   $AIOPS_SITE_CONFIG                        (explicit path override)
#   $CONFORMA_SKILL_SITE_CONFIG_URL           (override remote fetch URL)
#
# The loader (scripts/site_config.py) reads this file at runtime and
# populates environment variables. Env vars set before loading take
# precedence -- the site config only fills in unset variables.
#
# This file is safe to commit (no real values). Your filled-in copy
# must NOT be committed to the public repo.

# TENANT — Konflux tenant name for auto-discovery (e.g. "rhoai-tenant")
#   When set without konflux.cluster_domain, triggers automatic discovery of
#   cluster, policy files, and RPA paths from the konflux-release-data GitLab repo.
tenant: ""

# PREFERRED_CLUSTER — which cluster to use when tenant exists on multiple clusters
#   Only needed if your tenant spans multiple clusters (e.g. prod + stage).
#   If omitted and multiple clusters are found, discovery errors with available options.
preferred_cluster: ""

gitlab:
  # GITLAB_HOST — internal GitLab instance hostname (VPN required)
  host: ""
  # GITLAB_PROJECT — default GitLab project for Conforma policy data
  project: "releng/konflux-release-data"

konflux:
  # KONFLUX_EXTERNAL_API — API URL for the external (ODH) Konflux cluster
  external_api: ""
  # KONFLUX_INTERNAL_API — API URL for the internal (RHOAI) Konflux cluster
  #   Derived from cluster_domain if empty: https://api.<domain>.openshiftapps.com:6443
  internal_api: ""
  # KONFLUX_NAMESPACE — target namespace on the Konflux cluster
  namespace: ""

  # KRD_CLUSTER_DOMAIN — cluster domain segment (the primary Konflux identifier)
  #   Used to derive repo paths, API URLs, and Tekton routes. Example: my-cluster.abcd.p1
  #   Paths derived:  config/<domain>/product/EnterpriseContractPolicy/
  #   API derived:    https://api.<domain>.openshiftapps.com:6443
  #   Tekton derived: tekton-results-tekton-results.apps.<domain>.openshiftapps.com
  cluster_domain: ""

component_catalog:
  # COMPONENT_CATALOG_PROJECT — GitLab project path for the component-maturity
  # catalog (on $GITLAB_HOST). Provides component-name to Jira-component mapping.
  gitlab_project: "data-hub/component-maturity"

slack:
  # SLACK_WORKSPACE_URL — Slack workspace base URL (used to build search links)
  workspace_url: ""
