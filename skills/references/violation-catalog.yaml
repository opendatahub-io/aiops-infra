# Conforma Violation Catalog
#
# Single source of truth for all known RHOAI Conforma violation types,
# their classification, troubleshooting steps, and resolution guidance.
#
# Referenced by: conforma-remedy, conforma-analyze, conforma-exception
# Location: skills/references/violation-catalog.yaml
#
# Schema:
#   violations[].type: conforma_violation | operational_issue
#   violations[].conforma_rule_codes: list (optional for operational_issue)
#   violations[].classification.resolution_path: code_fix | operational | exception_likely | mixed
#   violations[].classification.typical_owner: component_team | devops | konflux_team
#   violations[].classification.estimated_effort: low | medium | high
#   violations[].classification.requires_rebuild: bool
#   known_false_alerts[].action: ignore

source_url: "https://docs.google.com/document/d/1LsHzcZ2TAIIc4slqAdMnDBovYa2EzgOD8bWx-QXR8kM/"
last_synced_from_doc: "2026-06-08"

violations:
  - id: hermetic_task.hermetic
    type: conforma_violation
    title: "Build task was not invoked with the hermetic parameter set"
    description: >-
      All container images built by Internal Red Hat Konflux are required to be
      built in Hermetic environment. The 'hermetic' parameter of PipelineRun spec
      should be set to 'true'. Hermetic builds don't have access to the Internet
      or any network resources outside of the build node. All packages (pip, RPMs,
      gomod etc.) must be prefetched as part of the 'prefetch-dependencies' step.
    conforma_rule_codes:
      - hermetic_task.hermetic
    aliases:
      - "hermetic"
      - "hermetic build"
      - "non-hermetic"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "Build task was not invoked with the hermetic parameter set"
    fix_steps:
      - action: "Set hermetic=true in the component PipelineRun YAML (.tekton/ directory or konflux-central pipeline)"
        reference: "https://konflux-ci.dev/docs/building/hermetic-builds/"
      - action: "Enable prefetch-dependencies for all packages (pip, RPMs, gomod)"
        reference: "https://konflux-ci.dev/docs/building/prefetching-dependencies/"
      - action: "Rebuild the component in Konflux"
    exception_context:
      when_to_exception: >-
        Only if making the build hermetic is genuinely not feasible (e.g.,
        dependency on network resources that cannot be prefetched). Component
        team must be actively working on making builds hermetic with DevOps
        team supporting (e.g., helping with RPM lock files).
      exception_template_category: non_hermetic_build

  - id: trusted_task.trusted.unpinned_reference
    type: conforma_violation
    title: "Task XXXX is used by pipeline task YYYY via an unpinned reference"
    description: >-
      A Konflux task container image used during build was not pinned to a
      specific tag. For example, 'main' branch was used instead of a commit
      hash or image SHA. All task references must be pinned to a specific
      commit or image SHA for reproducibility and trust.
    conforma_rule_codes:
      - trusted_task.trusted
    aliases:
      - "unpinned reference"
      - "unpinned task"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: devops
      estimated_effort: low
      requires_rebuild: true
    symptoms:
      - "via an unpinned reference"
    fix_steps:
      - action: "Pin the task to a specific commit hash or image SHA in konflux-central"
        reference: "https://github.com/red-hat-data-services/konflux-central"
      - action: "Rebuild the component's container image in Konflux"

  - id: trusted_task.trusted.not_built_by_trusted
    type: conforma_violation
    title: "Image not built by a trusted task"
    description: >-
      The Konflux task bundle container images used to build the component are
      outdated. Updating Konflux task bundle references is automatic for
      Pipelines in konflux-central via Renovate, but the affected components
      may need to be rebuilt manually if the update didn't propagate.
    conforma_rule_codes:
      - trusted_task.trusted
    aliases:
      - "untrusted task"
      - "trusted task"
      - "not built by a trusted task"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: devops
      estimated_effort: low
      requires_rebuild: true
    symptoms:
      - "Image \"quay.io/...\" not built by a trusted task: Build Task(s) \"build-image-index,buildah-oci-ta\" are not trusted"
    fix_steps:
      - action: "Ensure the SHA of the task bundle container image is recent (less than a month old) -- check on quay.io"
      - action: "If old, update the SHA to a recent one in konflux-central (do NOT change the version tag, e.g. 0.2 -> 0.3)"
      - action: "Rebuild the component container image in Konflux to use the updated task bundle"
    exception_context:
      when_to_exception: >-
        Rarely needed. Usually a rebuild with updated task bundles resolves this.
        Exception only if Konflux tooling has a known delay in publishing trusted bundles.
      exception_template_category: unsupported_task

  - id: trusted_task.trusted.missing_buildah
    type: conforma_violation
    title: "One of buildah/buildah-remote/buildah-oci-ta/buildah-remote-oci-ta tasks is missing"
    description: >-
      Most likely caused by an outdated Konflux container image reference.
      The procedure to fix is the same as for 'not built by a trusted task'.
    conforma_rule_codes:
      - trusted_task.trusted
    aliases:
      - "missing buildah"
      - "buildah task missing"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: devops
      estimated_effort: low
      requires_rebuild: true
    symptoms:
      - "One of \"buildah\", \"buildah-remote\", \"buildah-oci-ta\", \"buildah-remote-oci-ta\" tasks is missing"
    fix_steps:
      - action: "Update the Konflux task bundle SHA to a recent version in konflux-central"
      - action: "Rebuild the component container image in Konflux"

  - id: trusted_task.trusted.untrusted_version
    type: conforma_violation
    title: "Untrusted version of PipelineTask included in the build chain"
    description: >-
      The error message itself specifies which task needs updating and provides
      the target SHA. Update the mentioned task's container image reference
      to the suggested version in konflux-central.
    conforma_rule_codes:
      - trusted_task.trusted
    aliases:
      - "untrusted version"
      - "upgrade the task version"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: devops
      estimated_effort: low
      requires_rebuild: true
    symptoms:
      - "was included in the build chain comprised of"
      - "Please upgrade the task version to"
    fix_steps:
      - action: "Update the task's container image reference to the SHA suggested in the error message, in konflux-central"
      - action: "Rebuild the component in Konflux"

  - id: no_conforma_report_in_slack
    type: operational_issue
    title: "No Conforma report/notification in Slack"
    description: >-
      There may be problems with running the conforma-reporter GitHub Action.
      This is NOT a conforma policy violation but an infrastructure issue that
      prevents results from being reported.
    aliases:
      - "no slack report"
      - "missing conforma notification"
      - "no conforma report"
    classification:
      resolution_path: operational
      fixable_at_code_level: false
      typical_owner: devops
      estimated_effort: low
      requires_rebuild: false
    symptoms:
      - "No results appearing in #rhoai-konflux-poc-notifications Slack channel"
      - "conforma-reporter GitHub Action failing"
    fix_steps:
      - action: "Check the conforma-reporter GitHub Action latest run and history for failures"
      - action: "Investigate and fix the workflow failure (snapshot creation, parsing results, Slack notification)"

  - id: fbc_fips_check_missing
    type: conforma_violation
    title: "One of fbc-fips-check/fbc-fips-check-oci-ta tasks is missing"
    description: >-
      This error appears for FBC fragment conforma check. The FIPS check normally
      runs as part of the rhoai-fbc-fragment build but takes 3-4 hours on recent
      releases. Due to this, the FIPS task is disabled on CI (on-push) builds and
      runs only on nightly ('on-schedule') builds. If conforma highlights the FIPS
      check missing for CI builds, it can be ignored. If it appears on nightly
      reports, it needs investigation.
    conforma_rule_codes:
      - test.no_failed_tests
    aliases:
      - "fips check missing"
      - "fbc-fips-check missing"
    classification:
      resolution_path: mixed
      fixable_at_code_level: false
      typical_owner: devops
      estimated_effort: low
      requires_rebuild: false
    symptoms:
      - "One of \"fbc-fips-check\", \"fbc-fips-check-oci-ta\" tasks is missing"
    fix_steps:
      - action: "If this appears on CI (on-push) builds only -- it can be ignored (FIPS is disabled for push builds)"
      - action: "If this appears on nightly (on-schedule) reports -- investigate the fbc-fips-check task in the nightly pipeline"
      - action: "Check the 'when' condition for fbc-fips-check-oci-ta in the fbc-fragment-build.yaml pipeline in konflux-central"
        reference: "https://issues.redhat.com/browse/KONFLUX-9956"

  - id: rpm_signature.allowed
    type: conforma_violation
    title: "Signing key is not one of the allowed keys"
    description: >-
      Only software meeting these criteria can be part of RHOAI: (1) software
      built by Red Hat (signed by key 199e2f91fd431d51), (2) software from
      external sources where we can include the source code in the source
      container image, (3) software from an external source with a formal
      agreement (e.g., Intel, NVIDIA). The component team should be contacted
      and resolution options explored.
    conforma_rule_codes:
      - rpm_signature.allowed
    aliases:
      - "rpm signature"
      - "signing key"
      - "rpm signing"
      - "allowed key"
      - "not one of the allowed keys"
    classification:
      resolution_path: mixed
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: high
      requires_rebuild: true
    symptoms:
      - "is not one of the allowed keys"
    fix_steps:
      - action: "Contact the component team and explore resolution options"
      - action: "Option 1: Install the RPMs from a Red Hat repository"
      - action: "Option 2: Install the RPMs from RH AIPCC or RHAIIS"
      - action: "Option 3: If unavailable from Red Hat, build the RPMs from source"
      - action: "Option 4 (last resort): Ensure a valid legal support agreement with the vendor and request a conforma exception"
      - action: "Check the 3rd-party packages spreadsheet for existing work items"
        reference: "https://docs.google.com/spreadsheets/d/1o2j87H-k33eBsDcxR4oeqpNJJZe_TqHarnEBw-PqepM/edit?gid=1354667519#gid=1354667519"
      - action: "After resolution, rebuild the component in Konflux"
    exception_context:
      when_to_exception: >-
        When none of the code-fix options are possible. Requires a legal
        agreement between Red Hat and the vendor of the packages. Use the
        conforma-exception skill with the rpm_signature_thirdparty template.
      exception_template_category: rpm_signature_thirdparty

  - id: rpm_packages.unique_version
    type: conforma_violation
    title: "Mismatched versions of RPM found across different arches"
    description: >-
      This violation appears for container images built for multiple CPU
      architectures. It means one arch has a different version of an RPM
      than another. This can happen if a newer RPM version was released
      during the build window, or if the Dockerfile has conditional logic
      installing different versions per arch.
    conforma_rule_codes:
      - rpm_packages.unique_version
    aliases:
      - "unique version"
      - "rpm version"
      - "version mismatch"
      - "multi-arch version"
      - "mismatched versions"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "RPM were found across different arches"
    fix_steps:
      - action: "First, rebuild the component to confirm the issue is persistent (not just unfortunate timing)"
      - action: "Check if the Dockerfile.konflux has IF/THEN or other conditional logic per architecture"
      - action: "Highlight to the component team -- they need to ensure the same RPM version is installed across all architectures"
      - action: "Component team may need DevOps support for locking RPM versions"

  - id: rpm_repo_id_check
    type: conforma_violation
    title: "RPM repo id check failed: unknown or disallowed repository_id"
    description: >-
      Repository IDs used in the component's Dockerfile must include the
      architecture in their name (e.g., ubi-9-for-x86_64-baseos-rpms
      instead of ubi-9-baseos-rpms). The names must match the allowed
      repository IDs in the Konflux policy.
    conforma_rule_codes:
      - sbom.allowed
    aliases:
      - "repo id check"
      - "repository_id"
      - "disallowed repository"
      - "unknown repository"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "RPM repo id check failed: An RPM component in the SBOM specified an unknown or disallowed repository_id"
    fix_steps:
      - action: "Fix the repository IDs in the component's repo file (e.g., ubi.repo) to include architecture"
        reference: "https://konflux-ci.dev/docs/troubleshooting/releases/#unknown-or-invalid-repository_id"
      - action: "Example: change [ubi-9-baseos-rpms] to [ubi-9-for-x86_64-baseos-rpms]"
      - action: "Check all allowed repo IDs"
        reference: "https://github.com/release-engineering/rhtap-ec-policy/blob/main/data/known_rpm_repositories.yml"
      - action: "Rebuild the rpms.lock.yaml file"
        reference: "https://konflux-ci.dev/docs/building/prefetching-dependencies/#rpm"
      - action: "Commit/merge the changes and rebuild the component in Konflux"

  - id: tasks.required_untrusted_task_found
    type: conforma_violation
    title: "Task is or will be unsupported -- upgrade to a newer version"
    description: >-
      The component was built with a task that is (or will be) outdated/expired.
      Renovate is configured to automatically bump digests to the newest SHA for
      each Konflux task in konflux-central pipelines. It raises a PR and
      auto-merges it. However, sometimes the PR is not merged automatically.
    conforma_rule_codes:
      - tasks.required_untrusted_task_found
    aliases:
      - "required untrusted task"
      - "unsupported task"
      - "deprecated task"
      - "upgrade to a newer version"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: devops
      estimated_effort: low
      requires_rebuild: true
    symptoms:
      - "is or will be unsupported as of"
      - "Upgrade to a newer version of the Task"
    fix_steps:
      - action: "Check for unmerged Renovate PRs in konflux-central for the affected rhoai version"
        reference: "https://github.com/red-hat-data-services/konflux-central/pulls"
      - action: "Verify the task bundle digest is recent (check on quay.io, should be less than 3-4 weeks old)"
      - action: "If an open Renovate PR exists and the digest is recent, merge it"
      - action: "If no PR exists, manually update the SHA to the latest image for the given tag in konflux-central"
      - action: "Rebuild the affected components in Konflux (components are NOT automatically rebuilt when SHAs change in konflux-central)"

  - id: test.no_failed_tests.fbc_fips_check_erred
    type: conforma_violation
    title: "The Task fbc-fips-check-oci-ta from the build Pipeline reports a test erred"
    description: >-
      FIPS check task reported an error. Need to investigate the detailed logs
      from the rhoai-fbc-fragment build in Konflux (not the conforma run).
      Note that CI (on-push) builds may not have FIPS check enabled due to
      it taking 2-4 hours.
    conforma_rule_codes:
      - test.no_failed_tests
    aliases:
      - "fips check erred"
      - "fbc-fips-check erred"
      - "fips test erred"
    classification:
      resolution_path: mixed
      fixable_at_code_level: false
      typical_owner: component_team
      estimated_effort: high
      requires_rebuild: false
    symptoms:
      - "The Task \"fbc-fips-check-oci-ta\" from the build Pipeline reports a test erred"
    fix_steps:
      - action: "Find the most recent successful rhoai-fbc-fragment build in Konflux (not the conforma run)"
      - action: "If no fips-check on the most recent build, find the most recent 'on-schedule' build"
      - action: "Go to Logs -> Task Runs -> fbc-fips-check-oci-ta -> Download the log"
      - action: "Filter the log to remove known false positives"
        reference: "grep -i error *fbc-fips-check-oci-ta.log | grep -viE 'go binary is not CGO_ENABLED|executable is not dynamically linked|Error parsing image name.*registry.redhat.io|Error: run failed|error resolving name for image ref registry.redhat.io/'"
      - action: "Investigate remaining errors and coordinate with the component team"
      - action: "Check images-mirror-set.yaml for missing mappings if errors relate to image download failures"
        reference: "https://github.com/red-hat-data-services/RHOAI-Build-Config/blob/rhoai-3.2/.tekton/images-mirror-set.yaml"

  - id: version_label_mismatch
    type: operational_issue
    title: "Version label X does not match expected Y"
    description: >-
      The conforma-reporter GitHub workflow checks if all container images on
      quay.io have the correct Version label before creating a snapshot. If
      some images don't have the expected label, this error appears. Usually
      resolved by rebuilding the component in Konflux.
    aliases:
      - "version label mismatch"
      - "version label does not match"
    classification:
      resolution_path: operational
      fixable_at_code_level: false
      typical_owner: devops
      estimated_effort: low
      requires_rebuild: true
    symptoms:
      - "Version label v3.4.0 does not match expected v3.4.0-ea.1"
    fix_steps:
      - action: "Rebuild the component in Konflux -- this will publish the container image with correct labels to quay.io"

  - id: test.no_failed_tests.fbc_target_index_pruning
    type: conforma_violation
    title: "The Task fbc-target-index-pruning-check reports a failed test"
    description: >-
      The conforma report doesn't give details of the failed test itself.
      Need to check the rhoai-fbc-fragment build logs in Konflux. Often
      caused by channel resets (e.g., beta channel reset). Requires a
      self-service FBC exception with image digests for all supported OCP versions.
    conforma_rule_codes:
      - "test.no_failed_tests:fbc-target-index-pruning-check"
    aliases:
      - "fbc-target-index-pruning-check"
      - "pruning check failed"
      - "target index pruning"
    classification:
      resolution_path: mixed
      fixable_at_code_level: false
      typical_owner: devops
      estimated_effort: medium
      requires_rebuild: false
    symptoms:
      - "The Task \"fbc-target-index-pruning-check\" from the build Pipeline reports a failed test"
    fix_steps:
      - action: "Check the most recent successful rhoai-fbc-fragment build in Konflux for fbc-target-index-pruning-check logs"
      - action: "Search the log for lines containing '!FAILURE!'"
      - action: "Confirm with Rishab Prasad if this is caused by a channel reset (e.g., beta channel)"
      - action: "If confirmed, add image refs to the self-service FBC exception file"
        reference: "https://$GITLAB_HOST/releng/konflux-release-data/-/blob/main/exceptions/fbc-rhoai-prod.yaml"
      - action: "Get image digests using skopeo for all supported OCP versions (e.g., 4.19, 4.20, 4.21)"
      - action: "Merge the change on GitLab (DevOps has write/merge access to this file)"
    exception_context:
      when_to_exception: >-
        This violation typically requires a self-service FBC exception rather than
        a code fix. DevOps has merge access to the exceptions file directly.
      exception_template_category: fbc_pruning_test

  - id: builtin.attestation.signature_check
    type: conforma_violation
    title: "No image attestations found matching the given public key"
    description: >-
      The Conforma engine verifies that every container image has a signed
      SLSA Provenance attestation (.att OCI artifact) that matches the expected
      public key. This is a built-in check that runs automatically on every
      validation, regardless of the policy rules configured. When no .att
      artifact exists on the image registry (quay.io), the check fails.
      Attestations are normally created by Tekton Chains, which observes
      completed PipelineRuns and automatically generates signed SLSA provenance
      attestations. Chains pushes .sig (image signature) and .att (attestation)
      OCI artifacts alongside the image. If Chains fails or is not configured,
      the attestation will be missing.
    conforma_rule_codes:
      - builtin.attestation.signature_check
    aliases:
      - "attestation signature check"
      - "no matching attestations"
      - "attestation signature"
      - "missing attestation"
      - "no image attestations"
    classification:
      resolution_path: mixed
      fixable_at_code_level: false
      typical_owner: devops
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "No image attestations found matching the given public key. Verify the correct public key was provided, and one or more attestations were created. Error: no matching attestations"
    fix_steps:
      - action: "Confirm no .att artifact exists on quay.io by checking the image tags page for a corresponding .att tag"
      - action: "Run 'cosign tree <IMAGE>' to list all supply chain artifacts (signatures, attestations, SBOMs) attached to the image"
        reference: "https://conforma.dev/docs/user-guide/cosign.html"
      - action: "Find the most recent PipelineRun that built this image and check the annotation 'chains.tekton.dev/signed' — 'true' means Chains succeeded, 'failed' means it did not"
        reference: "https://konflux-ci.dev/docs/troubleshooting/releases/"
      - action: "If 'chains.tekton.dev/signed=failed': check the Tekton Chains controller logs for UNAUTHORIZED errors pushing .sig/.att artifacts"
      - action: "Verify the component service account 'build-pipeline-<COMPONENT_NAME>' has only the 'appstudio-pipeline-dockercfg-*' secret in its imagePullSecrets — extra or incorrect secrets cause Chains auth failures"
        reference: "https://konflux-ci.dev/docs/troubleshooting/releases/"
      - action: "Verify the public key in the EnterpriseContractPolicy matches the cluster signing key: kubectl get -n openshift-pipelines secret public-key -o json | jq -r '.data.\"cosign.pub\" | @base64d'"
        reference: "https://conforma.dev/docs/user-guide/hitchhikers-guide.html"
      - action: "Rebuild the component in Konflux — a successful build with properly configured Tekton Chains will create the attestation automatically"
    exception_context:
      when_to_exception: >-
        Only if the image is intentionally not built through a Konflux pipeline
        (e.g., a third-party image or an image built by another team's
        infrastructure). The component team must confirm the image source
        and whether attestation can be added through an alternative mechanism.
      exception_template_category: attestation_missing

  - id: builtin.attestation.syntax_check
    type: conforma_violation
    title: "Attestation syntax check failed"
    description: >-
      The Conforma engine verifies that the attestation attached to the image
      has valid in-toto SLSA Provenance format. This is a built-in check that
      runs automatically. A syntax failure typically means the attestation
      exists but is malformed — either Tekton Chains produced a corrupt
      attestation or the predicate type does not match expectations.
    conforma_rule_codes:
      - builtin.attestation.syntax_check
    aliases:
      - "attestation syntax"
      - "attestation format"
      - "malformed attestation"
    classification:
      resolution_path: operational
      fixable_at_code_level: false
      typical_owner: devops
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "Attestation syntax check failed"
    fix_steps:
      - action: "Run 'cosign verify-attestation --type slsaprovenance --key cosign.pub <IMAGE> --insecure-ignore-tlog' to inspect the raw attestation content"
        reference: "https://conforma.dev/docs/user-guide/cosign.html"
      - action: "Run 'ec validate image --public-key cosign.pub --image <IMAGE> --policy \"\" --output policy-input' to export the raw attestation data for debugging"
        reference: "https://conforma.dev/docs/user-guide/hitchhikers-guide.html"
      - action: "Check the Tekton Chains controller version and logs for errors during attestation generation"
      - action: "Rebuild the component in Konflux — Chains will regenerate the attestation"

  - id: builtin.image.signature_check
    type: conforma_violation
    title: "Image signature check failed"
    description: >-
      The Conforma engine verifies that the container image itself has a valid
      cosign signature (.sig OCI artifact) matching the expected public key.
      This is a built-in check separate from the attestation signature check.
      If the image was not signed by Tekton Chains (no .sig artifact on the
      registry) or was signed with a different key, this check fails.
    conforma_rule_codes:
      - builtin.image.signature_check
    aliases:
      - "image signature check"
      - "image signature"
      - "missing signature"
      - "signature check failed"
    classification:
      resolution_path: mixed
      fixable_at_code_level: false
      typical_owner: devops
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "Image signature check failed"
      - "No image signatures found matching the given public key"
    fix_steps:
      - action: "Check quay.io for a .sig tag corresponding to the image digest"
      - action: "Run 'cosign verify --key cosign.pub <IMAGE> --insecure-ignore-tlog' to test image signature verification"
        reference: "https://conforma.dev/docs/user-guide/cosign.html"
      - action: "Check the PipelineRun annotation 'chains.tekton.dev/signed' for success/failure"
        reference: "https://konflux-ci.dev/docs/troubleshooting/releases/"
      - action: "Verify the public key matches the cluster signing key"
      - action: "Rebuild the component in Konflux"
    exception_context:
      when_to_exception: >-
        Only if the image source does not support Tekton Chains signing
        (e.g., externally built images). The component team must confirm.
      exception_template_category: signature_missing

  - id: prefetch_dependencies.mode_not_permissive
    type: conforma_violation
    title: "Prefetch-dependencies mode is permissive"
    description: >-
      The prefetch-dependencies task mode should not be set to 'permissive'.
      Change it to a secure value in the PipelineRun YAML.
    conforma_rule_codes:
      - prefetch_dependencies.mode_not_permissive
    aliases:
      - "permissive prefetch"
      - "permissive prefetch mode"
      - "mode not permissive"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: devops
      estimated_effort: low
      requires_rebuild: true
    symptoms:
      - "Prefetch dependencies task has mode set to permissive"
    fix_steps:
      - action: "Change the prefetch-dependencies task mode from 'permissive' to a secure value in the PipelineRun YAML"
        where: "Component .tekton/ directory or konflux-central pipeline"
      - action: "Rebuild the component in Konflux"

  - id: prefetch_dependencies.package_registry_proxy_enabled
    type: conforma_violation
    title: "Package registry proxy not enabled"
    description: >-
      The prefetch-dependencies task should have the package registry proxy
      enabled for secure dependency resolution.
    conforma_rule_codes:
      - prefetch_dependencies.package_registry_proxy_enabled
    aliases:
      - "package registry"
      - "registry proxy"
      - "package registry proxy"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: devops
      estimated_effort: low
      requires_rebuild: true
    symptoms:
      - "Package registry proxy is not enabled for prefetch-dependencies"
    fix_steps:
      - action: "Set enable-package-registry-proxy=true in the prefetch-dependencies task parameters"
        where: "Component .tekton/ directory or konflux-central pipeline"
      - action: "Rebuild the component in Konflux"

  - id: sbom_spdx.disallowed_package_attributes
    type: conforma_violation
    title: "Disallowed package attributes"
    description: >-
      The SPDX SBOM attached to the image contains packages with attributes
      that are not permitted by the Conforma policy. A common example is
      'hermeto:pip:package:binary' set to 'true', which means a Python
      package was installed from a binary wheel rather than built from source.
      This fires per-package, so a single image can produce dozens of violations.
    conforma_rule_codes:
      - sbom_spdx.disallowed_package_attributes
    aliases:
      - "disallowed package attributes"
      - "disallowed attributes"
      - "sbom disallowed"
      - "binary package"
      - "hermeto binary"
    classification:
      resolution_path: mixed
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: high
      requires_rebuild: true
    symptoms:
      - "has the attribute \"hermeto:pip:package:binary\" set to \"true\""
      - "Confirm the SPDX SBOM contains only packages without disallowed attributes"
    fix_steps:
      - action: "Identify which packages have disallowed attributes from the violation details (look for 'hermeto:pip:package:binary')"
      - action: "Update the build to install packages from source instead of binary wheels (e.g., pip install --no-binary=:all:)"
      - action: "If using Hermeto/Cachi2 for prefetch, ensure it fetches source distributions (sdists) not wheels"
        reference: "https://konflux-ci.dev/docs/building/prefetching-dependencies/"
      - action: "Rebuild the component in Konflux and verify the SBOM no longer has disallowed attributes"
    exception_context:
      when_to_exception: >-
        When source distributions are not available for the affected packages
        and building from source is not feasible. This is often a systemic
        issue requiring Konflux tooling improvements (Hermeto/Cachi2 config).
      exception_template_category: sbom_disallowed_attributes

  - id: tasks.required_tasks_found
    type: conforma_violation
    title: "All required tasks were included in the pipeline"
    description: >-
      The build pipeline attestation does not contain one or more tasks that
      the Conforma policy requires. The required task list is defined in the
      policy data sources. For FBC fragment components, this commonly fires
      because fbc-fips-check takes 2-4 hours and is excluded from on-push
      builds, running only on nightly/scheduled builds.
    conforma_rule_codes:
      - tasks.required_tasks_found
    aliases:
      - "required tasks"
      - "missing task"
      - "required task missing"
      - "required tasks found"
    classification:
      resolution_path: mixed
      fixable_at_code_level: true
      typical_owner: devops
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "is missing from the build pipeline attestation"
      - "All required tasks were included in the pipeline"
    fix_steps:
      - action: "Check which tasks are missing from the violation 'term' field (e.g., fbc-fips-check, fbc-fips-check-oci-ta)"
      - action: "If the missing task is fbc-fips-check on a push build, this is expected — FIPS runs only on nightly builds"
      - action: "Add the missing task to the .tekton/ pipeline YAML, or add a policy exclusion if the task cannot run on push builds"
        reference: "https://konflux-ci.dev/docs/building/customizing-the-build/"
      - action: "For policy exclusions, add entries like 'tasks.required_tasks_found:TASK_NAME' to the EC policy exclude list"
        reference: "https://conforma.dev/docs/cli/configuration.html"
      - action: "Rebuild the component in Konflux"
    exception_context:
      when_to_exception: >-
        When a required task cannot be added to the pipeline (e.g., FIPS check
        on push builds due to 2-4h runtime). Use volatile (time-bounded)
        exceptions in the EC policy file.
      exception_template_category: required_task_missing

  - id: labels.required_labels
    type: conforma_violation
    title: "Required labels missing from the image"
    description: >-
      The container image is missing one or more OCI labels required by the
      Conforma policy. Common required labels include name, version,
      description, summary, vendor, and url. Labels are set during the
      build-container task and can be added via LABELS parameter or the
      generate-labels task.
    conforma_rule_codes:
      - labels.required_labels
    aliases:
      - "required labels"
      - "missing labels"
      - "image labels"
      - "oci labels"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "is missing from the image"
      - "label is required but not set"
    fix_steps:
      - action: "Check which labels are missing from the violation details"
      - action: "Add the missing labels via the LABELS parameter of the build-container task in .tekton/ PipelineRun YAML"
        reference: "https://konflux-ci.dev/docs/building/labels-and-annotations/"
      - action: "Alternatively, add labels to the Dockerfile using LABEL instructions"
      - action: "For dynamic labels (build date, commit), use the generate-labels task"
        reference: "https://konflux-ci.dev/docs/building/labels-and-annotations/"
      - action: "Rebuild the component in Konflux"

  - id: sbom.found
    type: conforma_violation
    title: "SBOM not found for the image"
    description: >-
      No Software Bill of Materials (SBOM) was found attached to the container
      image. Konflux automatically generates SBOMs during the build process
      via the Mobster tool. If the SBOM is missing, it usually indicates a
      build pipeline misconfiguration or a failed SBOM generation step.
    conforma_rule_codes:
      - sbom.found
    aliases:
      - "sbom found"
      - "missing sbom"
      - "sbom not found"
      - "no sbom"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: devops
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "No SBOM found for the image"
      - "SBOM not found"
    fix_steps:
      - action: "Verify the build pipeline includes the SBOM generation tasks (merge-sboms, source-build)"
      - action: "Check the build logs for SBOM-related task failures"
      - action: "Run 'cosign download sbom <IMAGE>' to verify if any SBOM is attached to the image"
        reference: "https://konflux-ci.dev/docs/metadata/sboms/"
      - action: "Rebuild the component in Konflux — SBOM generation is automatic when pipeline is properly configured"

  - id: base_image_registries.base_image_info_found
    type: conforma_violation
    title: "Base image information not found"
    description: >-
      Conforma could not find information about the base image used to build
      the component. The SBOM or build attestation does not contain the
      expected base image metadata. This can happen when the Dockerfile uses
      a base image that is not traceable (e.g., scratch builds, multi-stage
      builds with intermediate images that are not published).
    conforma_rule_codes:
      - base_image_registries.base_image_info_found
    aliases:
      - "base image info"
      - "base image not found"
      - "base image information"
    classification:
      resolution_path: mixed
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "Base image information not found"
      - "Could not find base image info"
    fix_steps:
      - action: "Check the Dockerfile for the base image reference — ensure it uses a fully qualified image reference (registry/repo@sha256:...)"
      - action: "If using multi-stage builds, ensure all intermediate images are from known registries"
      - action: "Verify the build-container task is emitting base image results correctly"
      - action: "Rebuild the component in Konflux"

  - id: base_image_registries.base_image_permitted
    type: conforma_violation
    title: "Base image is from a disallowed registry"
    description: >-
      The base image used in the Dockerfile is pulled from a registry that is
      not in the allowed list. For Red Hat products, base images must come from
      registry.redhat.io or brew.registry.redhat.io. Using images from
      docker.io, quay.io (non-Red Hat), or other registries triggers this
      violation.
    conforma_rule_codes:
      - base_image_registries.base_image_permitted
    aliases:
      - "base image permitted"
      - "disallowed registry"
      - "base image registry"
      - "disallowed base image"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "is from a disallowed registry"
      - "Base image is not from an allowed registry"
    fix_steps:
      - action: "Update the Dockerfile FROM instruction to use a base image from an allowed registry (registry.redhat.io or brew.registry.redhat.io)"
      - action: "If using a UBI base image, use registry.redhat.io/ubi9/ubi-minimal or equivalent"
      - action: "For images only available on non-allowed registries, set up image mirroring"
      - action: "Rebuild the component in Konflux"
    exception_context:
      when_to_exception: >-
        When the component genuinely requires a base image from a non-allowed
        registry (e.g., upstream community images) and no Red Hat equivalent
        exists. Component team must justify the registry choice.
      exception_template_category: base_image_registry

  - id: rpm_repos.ids_known
    type: conforma_violation
    title: "RPM has unknown repo id"
    description: >-
      One or more RPMs in the image were installed from a repository whose ID
      is not in the known/allowed list. The SBOM records which repo each RPM
      came from, and Conforma checks that repo ID against a curated allowlist.
      This commonly happens when the Dockerfile uses a .repo file with
      non-standard repository IDs.
    conforma_rule_codes:
      - rpm_repos.ids_known
    aliases:
      - "rpm repo id"
      - "unknown repo id"
      - "ids known"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "RPM has unknown repo id"
      - "Repository ID is not in the known list"
    fix_steps:
      - action: "Identify which RPMs have unknown repo IDs from the violation details"
      - action: "Ensure RPMs come from known Red Hat repositories with architecture-specific IDs (e.g., ubi-9-for-x86_64-baseos-rpms)"
        reference: "https://konflux-ci.dev/docs/building/prefetching-dependencies/"
      - action: "Check the allowed repository IDs list and ensure your .repo files match"
        reference: "https://github.com/release-engineering/rhtap-ec-policy/blob/main/data/known_rpm_repositories.yml"
      - action: "Rebuild the rpms.lock.yaml file if using RPM lockfiles"
        reference: "https://konflux-ci.dev/docs/building/prefetching-dependencies/"
      - action: "Rebuild the component in Konflux"

  - id: cve.cve_results_found
    type: conforma_violation
    title: "CVE scan results not found"
    description: >-
      No CVE scan results (SARIF) were found attached to the image. Konflux
      runs security scanners (Clair, Snyk) during build and attaches results
      as OCI artifacts. If the scan task failed or was not included in the
      pipeline, this violation fires. Note that for Helm charts and FBC
      fragments, CVE scanning may not be applicable.
    conforma_rule_codes:
      - cve.cve_results_found
    aliases:
      - "cve results"
      - "cve scan"
      - "missing cve"
      - "cve results found"
      - "vulnerability scan"
    classification:
      resolution_path: mixed
      fixable_at_code_level: true
      typical_owner: devops
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "CVE scan results not found for the image"
      - "No vulnerability scan results"
    fix_steps:
      - action: "Verify the build pipeline includes the clair-scan or clamav-scan tasks"
      - action: "Check the build logs for scan task failures or timeouts"
      - action: "Run 'cosign download attestation <IMAGE>' to check if scan results are attached"
        reference: "https://konflux-ci.dev/docs/metadata/scan-results/"
      - action: "For Helm charts or FBC fragments, CVE scanning may require a different pipeline configuration"
      - action: "Rebuild the component in Konflux"
    exception_context:
      when_to_exception: >-
        When the component type does not support CVE scanning (e.g., Helm
        charts, FBC fragments). The component team must confirm that the
        artifact type is not scannable by standard tools.
      exception_template_category: cve_scan_missing

  - id: tasks.successful_pipeline_tasks
    type: conforma_violation
    title: "Not all pipeline tasks completed successfully"
    description: >-
      One or more tasks in the build pipeline did not complete successfully.
      The attestation shows a task with a non-success status. This can be
      caused by transient failures (network, timeouts) or genuine build
      issues. Check the specific task logs in Konflux.
    conforma_rule_codes:
      - tasks.successful_pipeline_tasks
    aliases:
      - "successful pipeline tasks"
      - "pipeline task failed"
      - "task not successful"
    classification:
      resolution_path: mixed
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "did not complete successfully"
      - "Not all pipeline tasks completed successfully"
    fix_steps:
      - action: "Identify which task failed from the violation details"
      - action: "Check the Konflux build logs for the failing task to understand the error"
      - action: "If the failure is transient (timeout, network), rebuild the component"
      - action: "If the failure is persistent, fix the underlying issue in the component or pipeline config"
        reference: "https://konflux-ci.dev/docs/building/customizing-the-build/"
      - action: "Rebuild the component in Konflux"

  - id: source_image.exists
    type: conforma_violation
    title: "Source container image not found"
    description: >-
      The source container image associated with the binary image does not
      exist. Konflux builds automatically produce a source container image
      alongside the binary image via the source-build task. If the source
      image is missing, it usually means the source-build task was not
      included in the pipeline or it failed silently.
    conforma_rule_codes:
      - source_image.exists
    aliases:
      - "source image"
      - "source container"
      - "missing source image"
      - "source image exists"
    classification:
      resolution_path: mixed
      fixable_at_code_level: true
      typical_owner: devops
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "Source container image not found"
      - "source_image.exists"
    fix_steps:
      - action: "Verify the build pipeline includes the source-build task"
      - action: "Check the build logs for source-build task failures"
      - action: "Rebuild the component in Konflux — the source image is automatically produced when the pipeline is properly configured"
      - action: "After rebuild, verify the source image exists using 'cosign tree <IMAGE>'"
        reference: "https://conforma.dev/docs/user-guide/cosign.html"

  - id: source_image.signed
    type: conforma_violation
    title: "Source container image is not signed"
    description: >-
      The source container image exists but lacks a valid cryptographic
      signature. Tekton Chains should automatically sign all images
      (including source images) produced by PipelineRuns. If the source
      image is unsigned, it indicates a Chains configuration issue.
    conforma_rule_codes:
      - source_image.signed
    aliases:
      - "source image signed"
      - "unsigned source image"
      - "source image signature"
    classification:
      resolution_path: mixed
      fixable_at_code_level: false
      typical_owner: devops
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "Source container image is not signed"
      - "source_image.signed"
    fix_steps:
      - action: "Check if the source image exists first using 'cosign tree <IMAGE>'"
        reference: "https://conforma.dev/docs/user-guide/cosign.html"
      - action: "Verify the PipelineRun annotation 'chains.tekton.dev/signed' is 'true'"
        reference: "https://konflux-ci.dev/docs/troubleshooting/releases/"
      - action: "Check the Tekton Chains controller logs for signing errors"
      - action: "Verify the component service account has only the 'appstudio-pipeline-dockercfg-*' secret in its imagePullSecrets"
      - action: "Rebuild the component in Konflux"

  - id: test.no_failed_tests
    type: conforma_violation
    title: "A test task in the build pipeline reported a failure"
    description: >-
      One or more non-informative test tasks in the build pipeline reported
      a FAILED result via the TEST_OUTPUT task result. The failing test and
      task name are included in the violation message. For FBC fragment
      components, FIPS check failures on push builds are a known false
      positive (FIPS only runs on nightly builds).
    conforma_rule_codes:
      - test.no_failed_tests
    aliases:
      - "test failed"
      - "failed test"
      - "no failed tests"
      - "test failure"
    classification:
      resolution_path: mixed
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "from the build Pipeline reports a failed test"
      - "reports a failed test"
    fix_steps:
      - action: "Identify which test task failed from the violation message"
      - action: "Check the build logs in Konflux for the failing task to understand the test failure"
      - action: "For FBC components: if the failing task is fbc-fips-check on a push build, this is a known false positive — FIPS only runs on nightly"
      - action: "Fix the underlying test failure in the component code or configuration"
      - action: "Rebuild the component in Konflux"
        reference: "https://conforma.dev/docs/policy/packages/release_test.html"

  - id: test.no_erred_tests
    type: conforma_violation
    title: "A test task in the build pipeline reported an error"
    description: >-
      One or more test tasks in the build pipeline reported an ERROR result
      via the TEST_OUTPUT task result. An error (as opposed to a failure)
      typically means the test infrastructure itself had a problem, not
      that a test assertion failed.
    conforma_rule_codes:
      - test.no_erred_tests
    aliases:
      - "test erred"
      - "test error"
      - "erred test"
    classification:
      resolution_path: mixed
      fixable_at_code_level: false
      typical_owner: devops
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "from the build Pipeline reports a test erred"
      - "reports a test erred"
    fix_steps:
      - action: "Identify which test task erred from the violation message"
      - action: "Check the build logs in Konflux — errors usually indicate infrastructure issues, not test assertion failures"
      - action: "Common causes: network timeouts, unavailable external resources, misconfigured test parameters"
      - action: "If the error is transient, rebuild the component"
      - action: "If persistent, investigate the test task configuration and prerequisites"
        reference: "https://conforma.dev/docs/policy/packages/release_test.html"

  - id: cve.cve_blockers
    type: conforma_violation
    title: "Blocking CVE found in the image"
    description: >-
      The CVE scan found vulnerabilities at restricted severity levels
      (critical and high by default) that have a known fix available.
      The restricted levels are configurable via the
      restrict_cve_security_levels rule data key. A leeway period (in days
      from public disclosure) can be configured per severity.
    conforma_rule_codes:
      - cve.cve_blockers
    aliases:
      - "cve blocker"
      - "blocking cve"
      - "critical cve"
      - "high cve"
      - "cve vulnerability"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: high
      requires_rebuild: true
    symptoms:
      - "vulnerability of critical security level"
      - "vulnerability of high security level"
    fix_steps:
      - action: "Identify the CVEs and affected packages from the violation details"
      - action: "Update the affected packages to versions that include the CVE fix"
      - action: "If the CVE is in the base image, update the base image to a patched version"
      - action: "If a fix is not yet available, check if a leeway period applies (configured via cve_leeway in rule data)"
        reference: "https://conforma.dev/docs/policy/packages/release_cve.html"
      - action: "Rebuild the component in Konflux"

  - id: cve.unpatched_cve_blockers
    type: conforma_violation
    title: "Blocking unpatched CVE found in the image"
    description: >-
      The CVE scan found vulnerabilities at restricted severity levels
      that do NOT have a known fix available. By default, the restricted
      list for unpatched CVEs is empty (no block). When configured, these
      can only be remediated by removing the impacted dependency or
      waiting for a fix.
    conforma_rule_codes:
      - cve.unpatched_cve_blockers
    aliases:
      - "unpatched cve"
      - "unpatched vulnerability"
      - "no fix available"
    classification:
      resolution_path: mixed
      fixable_at_code_level: false
      typical_owner: component_team
      estimated_effort: high
      requires_rebuild: false
    symptoms:
      - "unpatched vulnerability of critical security level"
      - "unpatched vulnerability of high security level"
    fix_steps:
      - action: "Identify the unpatched CVEs and affected packages from the violation details"
      - action: "Check if the affected dependency can be removed or replaced with an alternative"
      - action: "If the dependency cannot be removed, wait for the upstream fix and monitor the CVE status"
      - action: "Consider requesting a policy exception if the risk is accepted"
        reference: "https://conforma.dev/docs/policy/packages/release_cve.html"

  - id: labels.deprecated_labels
    type: conforma_violation
    title: "Image uses deprecated labels"
    description: >-
      The container image contains labels that have been deprecated.
      Deprecated labels have replacement labels that should be used
      instead. The list of deprecated labels is defined in the
      deprecated_labels rule data key.
    conforma_rule_codes:
      - labels.deprecated_labels
    aliases:
      - "deprecated labels"
      - "deprecated label"
      - "label deprecated"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: low
      requires_rebuild: true
    symptoms:
      - "label is deprecated, replace with"
    fix_steps:
      - action: "Identify the deprecated labels and their replacements from the violation message"
      - action: "Update the Dockerfile LABEL instructions or the LABELS parameter in the build-container task to use the replacement labels"
        reference: "https://konflux-ci.dev/docs/building/labels-and-annotations/"
      - action: "Remove the deprecated label from the build configuration"
      - action: "Rebuild the component in Konflux"
        reference: "https://conforma.dev/docs/policy/packages/release_labels.html"

  - id: labels.disallowed_inherited_labels
    type: conforma_violation
    title: "Label inherited from parent image without override"
    description: >-
      Certain labels must be explicitly set on the child image and should
      not be inherited from the parent image with the parent's value.
      For example, 'name' and 'version' labels should reflect the child
      image, not the base image. FBC images use a separate list
      (fbc_disallowed_inherited_labels).
    conforma_rule_codes:
      - labels.disallowed_inherited_labels
    aliases:
      - "inherited label"
      - "disallowed inherited"
      - "parent label"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: low
      requires_rebuild: true
    symptoms:
      - "label should not be inherited from the parent image"
    fix_steps:
      - action: "Identify which labels are incorrectly inherited from the violation details"
      - action: "Explicitly set the flagged labels in the child image Dockerfile using LABEL instructions"
      - action: "Or set them via the LABELS parameter of the build-container task in .tekton/ PipelineRun YAML"
        reference: "https://konflux-ci.dev/docs/building/labels-and-annotations/"
      - action: "Rebuild the component in Konflux"
        reference: "https://conforma.dev/docs/policy/packages/release_labels.html"

  - id: olm.unpinned_references
    type: conforma_violation
    title: "Unpinned image references in OLM bundle"
    description: >-
      One or more image references in the OLM bundle CSV lack a digest
      (sha256) to uniquely identify the image version. All image
      references in the bundle must be pinned to a specific digest for
      reproducibility and security.
    conforma_rule_codes:
      - olm.unpinned_references
    aliases:
      - "unpinned olm"
      - "unpinned bundle"
      - "olm unpinned"
      - "unpinned image reference"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "image reference is not pinned"
    fix_steps:
      - action: "Identify which image references are unpinned from the violation details"
      - action: "Replace tag-based image references with digest-based ones (e.g., registry.redhat.io/repo:tag -> registry.redhat.io/repo@sha256:...)"
      - action: "Configure component nudging in Konflux so image digests are automatically updated when dependencies rebuild"
        reference: "https://konflux-ci.dev/docs/end-to-end/building-olm/"
      - action: "Rebuild the component in Konflux"
        reference: "https://conforma.dev/docs/policy/packages/release_olm.html"

  - id: olm.allowed_registries
    type: conforma_violation
    title: "OLM bundle image reference from disallowed registry"
    description: >-
      An image reference in the OLM bundle CSV is from a registry that is
      not in the allowed registry prefixes list. All CSV image references
      must match a prefix in the allowed_olm_image_registry_prefixes
      rule data.
    conforma_rule_codes:
      - olm.allowed_registries
    aliases:
      - "olm registry"
      - "olm allowed registry"
      - "csv image registry"
    classification:
      resolution_path: code_fix
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "csv image reference is not from an allowed registry"
    fix_steps:
      - action: "Identify which image references are from disallowed registries from the violation details"
      - action: "Update the CSV image references to use images from allowed registries (e.g., registry.redhat.io)"
      - action: "If the image must come from a different registry, check the allowed_olm_image_registry_prefixes rule data for the full allowed list"
      - action: "Rebuild the component in Konflux"
        reference: "https://conforma.dev/docs/policy/packages/release_olm.html"

  - id: olm.unmapped_references
    type: conforma_violation
    title: "Unmapped image reference in OLM bundle"
    description: >-
      An image reference in the OLM bundle CSV is not present in the
      release snapshot and is not already accessible in the target
      registry. This usually means the image was not built as part of
      the release or was not properly included in the snapshot.
    conforma_rule_codes:
      - olm.unmapped_references
    aliases:
      - "unmapped olm"
      - "unmapped image"
      - "olm unmapped"
    classification:
      resolution_path: mixed
      fixable_at_code_level: true
      typical_owner: component_team
      estimated_effort: medium
      requires_rebuild: true
    symptoms:
      - "csv image reference is not in the snapshot or accessible"
    fix_steps:
      - action: "Identify which image references are unmapped from the violation details"
      - action: "Ensure the referenced image is built as a component in the same Konflux application"
      - action: "Configure component nudging so the bundle CSV is updated when the referenced image is rebuilt"
        reference: "https://konflux-ci.dev/docs/end-to-end/building-olm/"
      - action: "Verify the image exists in the target registry and is accessible"
      - action: "Rebuild the component in Konflux"
        reference: "https://conforma.dev/docs/policy/packages/release_olm.html"

  - id: schedule.weekday_restriction
    type: conforma_violation
    title: "Release blocked on disallowed weekday"
    description: >-
      The release pipeline ran on a weekday that is in the disallowed
      list. This is a policy check to prevent releases on certain days
      (e.g., Fridays). Only applies to pipelines with pipeline_intention
      set to 'release' or 'production'.
    conforma_rule_codes:
      - schedule.weekday_restriction
    aliases:
      - "weekday restriction"
      - "disallowed weekday"
      - "release day blocked"
    classification:
      resolution_path: operational
      fixable_at_code_level: false
      typical_owner: devops
      estimated_effort: low
      requires_rebuild: false
    symptoms:
      - "is a disallowed weekday"
    fix_steps:
      - action: "Try again on a different day that is not in the disallowed list"
      - action: "Check the disallowed_weekdays rule data key to see which days are blocked"
        reference: "https://conforma.dev/docs/policy/packages/release_schedule.html"
      - action: "If the release is urgent, request a temporary policy exception for the weekday restriction"

  - id: schedule.date_restriction
    type: conforma_violation
    title: "Release blocked on disallowed date"
    description: >-
      The release pipeline ran on a date that is in the disallowed list.
      This is typically used for freeze periods, holidays, or other
      blackout windows. Only applies to pipelines with pipeline_intention
      set to 'release' or 'production'.
    conforma_rule_codes:
      - schedule.date_restriction
    aliases:
      - "date restriction"
      - "disallowed date"
      - "release date blocked"
      - "freeze"
    classification:
      resolution_path: operational
      fixable_at_code_level: false
      typical_owner: devops
      estimated_effort: low
      requires_rebuild: false
    symptoms:
      - "is a disallowed date"
    fix_steps:
      - action: "Try again on a different date that is not in the disallowed list"
      - action: "Check the disallowed_dates rule data key to see which dates are blocked"
        reference: "https://conforma.dev/docs/policy/packages/release_schedule.html"
      - action: "If the release is urgent, request a temporary policy exception for the date restriction"

known_false_alerts:
  - id: fbc_single_component_no_failed_tests
    title: "FBC single component failures (no_failed_tests)"
    description: >-
      FBC single component failures can usually be ignored because FIPS checks
      don't run for push pipelines, only for scheduled (nightly) builds.
    applies_to: "rhoai-fbc-fragment"
    conforma_rule_codes:
      - test.no_failed_tests
    action: ignore
    condition: >-
      Only ignore for single-component conforma runs (on-push). Investigate
      if this appears in the full conforma-reporter (Slack) reports.

  - id: odh_llama_stack_core_no_builds
    title: "Odh-llama-stack-core-rhel9 not showing builds"
    description: >-
      In rhoai-2.24 and 2.25, odh-llama-stack-core-rhel9 was built by the
      AIPCC team, not by us in Konflux. The component exists in our tenant
      but has no builds. Alerts about unknown build status or unknown conforma
      are expected.
    applies_to: "odh-llama-stack-core-rhel9"
    action: ignore
    condition: >-
      Only applies to rhoai-2.24 and rhoai-2.25. Component exists in tenant
      but was never actually built nor tested by our team.

  - id: odh_vllm_gaudi_signing_key
    title: "Odh-vllm-gaudi-v2-25 signing key violation"
    description: >-
      Odh-vllm-gaudi-v2-25 throws a signing key violation (key 05b555b38483c65d).
      There is an existing exception covering this.
    applies_to: "odh-vllm-gaudi-v2-25"
    conforma_rule_codes:
      - rpm_signature.allowed
    action: ignore
    condition: >-
      Covered by existing exception. See the 3rd-party packages spreadsheet.
    reference: "https://docs.google.com/spreadsheets/d/1o2j87H-k33eBsDcxR4oeqpNJJZe_TqHarnEBw-PqepM/edit?gid=1354667519#gid=1354667519"

  - id: odh_th06_disallowed_registry
    title: "Odh-th06-* disallowed registry errors"
    description: >-
      The odh-th06 images from distributed workflows throw a violation on
      single-conforma checks due to using workbench images for their base.
      Conforma flags this as a disallowed registry even though the base image
      references are updated through nudging. This should NOT appear in full
      conforma reports.
    applies_to: "odh-th06-*"
    action: ignore
    condition: >-
      Only ignore for single-component conforma runs. If this appears in full
      conforma reports, the auto-nudging updates of base image references are
      likely broken.
    reference: ""

  - id: fbc_no_failed_tests_push
    title: "no_failed_tests in rhoai-fbc-fragment on push builds"
    description: >-
      FIPS checks are not run as part of rhoai-fbc-fragment push builds because
      they take 4+ hours. The lack of FIPS check results is highlighted as a
      conforma violation on push builds. The nightly (on-schedule) conforma
      report should NOT have this violation.
    applies_to: "rhoai-fbc-fragment"
    conforma_rule_codes:
      - test.no_failed_tests
    action: ignore
    condition: >-
      Only ignore for on-push/CI builds. Nightly (on-schedule) reports should
      not have this violation -- investigate if they do.

# Fallback references for violation code prefixes not yet in the violations list.
# Used by generate_resolution_guide.py when a violation has no exact catalog match.
# Matching: longest code_prefix wins (e.g. "sbom_spdx.allowed" beats "sbom_spdx").
fallback_references:
  - code_prefix: "builtin.attestation"
    title: "Built-in attestation verification"
    doc_urls:
      - "https://conforma.dev/docs/user-guide/cosign.html"
      - "https://conforma.dev/docs/user-guide/hitchhikers-guide.html"
      - "https://konflux-ci.dev/docs/troubleshooting/releases/"
    guidance: >-
      Built-in attestation checks verify that images have signed SLSA Provenance
      attestations created by Tekton Chains. Check the PipelineRun annotation
      'chains.tekton.dev/signed' for success/failure, verify the component
      service account has correct imagePullSecrets, and rebuild if needed.

  - code_prefix: "builtin.image"
    title: "Built-in image signature verification"
    doc_urls:
      - "https://conforma.dev/docs/user-guide/cosign.html"
      - "https://konflux-ci.dev/docs/troubleshooting/releases/"
    guidance: >-
      Built-in image signature checks verify that the container image has a valid
      cosign signature (.sig artifact) matching the expected public key. Verify
      Tekton Chains is signing successfully and the correct public key is
      configured in the EnterpriseContractPolicy.

  - code_prefix: "builtin"
    title: "Built-in Conforma checks"
    doc_urls:
      - "https://conforma.dev/docs/user-guide/hitchhikers-guide.html"
      - "https://conforma.dev/docs/user-guide/cosign.html"
    guidance: >-
      Built-in Conforma checks run automatically on every validation regardless
      of policy configuration. They verify image signatures and attestation
      integrity. These are implemented in the Conforma CLI (not in Rego policy
      rules). Check Tekton Chains signing status and rebuild if needed.

  - code_prefix: "sbom_spdx.disallowed_package_attributes"
    title: "SBOM/SPDX disallowed package attributes"
    doc_urls:
      - "https://konflux-ci.dev/docs/releasing/release-policy/"
      - "https://github.com/release-engineering/rhtap-ec-policy/tree/main/data"
    guidance: >-
      Packages in the SBOM have attributes not permitted by the Conforma policy.
      Check the Conforma policy data for the list of disallowed attributes and update
      the image build to avoid them. This is often a systemic issue requiring
      Konflux-level tooling improvements rather than per-component fixes.

  - code_prefix: "sbom_spdx.allowed_package_sources"
    title: "SBOM/SPDX disallowed package source"
    doc_urls:
      - "https://konflux-ci.dev/docs/releasing/release-policy/"
      - "https://github.com/release-engineering/rhtap-ec-policy/tree/main/data"
    guidance: >-
      A package in the SBOM comes from a source not in the allowed list.
      Investigate which packages are flagged and either remove them or source
      them from an allowed repository. Rebuild after fixing.

  - code_prefix: "sbom_spdx"
    title: "SBOM/SPDX compliance"
    doc_urls:
      - "https://konflux-ci.dev/docs/releasing/release-policy/#sbom-rules"
      - "https://github.com/release-engineering/rhtap-ec-policy/tree/main/data"
    guidance: >-
      General SBOM/SPDX policy violation. Check the Conforma policy data for the
      specific rule requirements and update the image accordingly.

  - code_prefix: "source_image.exists"
    title: "Source container image must exist"
    doc_urls:
      - "https://konflux-ci.dev/docs/releasing/release-policy/"
    guidance: >-
      The source container image was not published alongside the binary image.
      Rebuild the component in Konflux — it should automatically produce the
      source image. If the issue persists after rebuild, investigate the build
      pipeline configuration for source-build task inclusion.

  - code_prefix: "source_image"
    title: "Source container image"
    doc_urls:
      - "https://konflux-ci.dev/docs/releasing/release-policy/"
    guidance: >-
      Source container image policy violation. Rebuild the component —
      Konflux auto-publishes the source image. Investigate pipeline config
      if the issue persists.

  - code_prefix: "tasks.successful_pipeline_tasks"
    title: "All pipeline tasks must succeed"
    doc_urls:
      - "https://konflux-ci.dev/docs/building/pipelines/"
    guidance: >-
      One or more tasks in the build pipeline did not complete successfully.
      Check Konflux build logs for the failing task. A rebuild may resolve
      transient failures. If persistent, investigate the pipeline configuration.

  - code_prefix: "tasks"
    title: "Pipeline task execution"
    doc_urls:
      - "https://konflux-ci.dev/docs/building/pipelines/"
    guidance: >-
      General pipeline task policy violation. Check Konflux build logs for the
      failing or misconfigured task.

  - code_prefix: "test.no_failed_tests"
    title: "No tests may fail"
    doc_urls:
      - "https://konflux-ci.dev/docs/building/pipelines/"
    guidance: >-
      A test task in the build pipeline reported a failure. Check Konflux build
      logs to identify which test failed and coordinate with the component team
      to fix it. If the failure is for fbc-fips-check on a push build, it may
      be a known false positive (FIPS only runs on nightly builds).
