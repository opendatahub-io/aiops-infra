# Issue body template and label configuration for conforma-feedback.
#
# Edit this file to change the issue structure or default labels.
# Placeholders use Python str.format() syntax: {field_name}.

labels:
  always:
    - conforma
    - conforma-skill
  bug:
    - bug
  enhancement:
    - enhancement

title_template: "[conforma-feedback] {issue_type}: {summary}"

body_template: |
  ## Summary

  {summary}

  ## Skill

  {skill_name}

  ## Expected Behavior

  {expected}

  ## Actual Behavior

  {actual}

  ## Error Output

  ```
  {error_output}
  ```

  ## Environment

  - **Python:** {python_version}
  - **OS:** {os_info}
  - **Platform:** {platform} ({host})
  - **Repository:** {repo_path}

  ## Severity

  {severity}

  ## Additional Context

  {additional_context}

infra_issue:
  title_template: "[infra] {skill_name}: {title_hint}"
  labels:
    - conforma
    - conforma-skill
    - infrastructure
    - bug
  body_template: |
    ## Infrastructure Failure

    | Field | Value |
    |-------|-------|
    | **Skill** | {skill_name} |
    | **Workflow step** | {workflow_step} |
    | **Script** | `{script_path}` |
    | **Error type** | {error_type} |
    | **Severity** | {severity} |

    ## Error

    ```
    {error_message}
    ```

    ## Full Traceback

    ```
    {traceback}
    ```

    {root_cause_section}

    ## Reproduction

    ```bash
    {reproduction_command}
    ```

    ## Environment

    - **Python:** {python_version}
    - **OS:** {os_info}
    - **Platform:** {platform} ({host})
    - **Repository:** {repo_path}
