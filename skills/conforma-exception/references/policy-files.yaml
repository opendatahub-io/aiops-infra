# Mapping of (component_type, environment) to GitLab policy file paths
# within the releng/konflux-release-data repository.
#
# Routing logic:
# - FBC fragment component -> {conforma_policy_dir}/fbc-*-{env}.yaml
# - Any other component -> {conforma_policy_dir}/registry-*-{env}.yaml
# - Self-service eligible -> exceptions/{type}-*-{env}.yaml
#
# Path resolution:
#   Paths are now resolved automatically by Konflux tenant env discovery. The system
#   discovers which files exist in the Conforma policy directory and matches them
#   by type prefix (registry/fbc) and environment suffix (prod/stage).
#
#   See: python3 scripts/konflux_tenant_env_discovery.py --tenant <name> --human

gitlab_project: ${GITLAB_PROJECT}
gitlab_host: ${GITLAB_HOST}
default_branch: main

# Paths below are auto-discovered from the tenant's cluster config.
# Set via: Konflux tenant env discovery -> KONFLUX_CONFORMA_POLICY_DIR env var
# Or manually: KONFLUX_CLUSTER_DOMAIN -> derived path
#
# Pattern: ${KONFLUX_CONFORMA_POLICY_DIR}/{type}-*-{env}.yaml
# Example: config/${KONFLUX_CLUSTER_DOMAIN}/product/EnterpriseContractPolicy/registry-rhoai-prod.yaml
paths:
  standing_exceptions:
    pattern: "${KONFLUX_CONFORMA_POLICY_DIR}/{type}-*-{env}.yaml"
    resolution: "Matched from KONFLUX_CONFORMA_POLICY_FILES env (comma-separated list of discovered files)"
    types: ["registry", "fbc"]
    environments: ["prod", "stage"]

  self_service:
    pattern: "exceptions/{type}-*-{env}.yaml"
    resolution: "Matched from KONFLUX_SELF_SERVICE_FILES env (comma-separated list of discovered files)"
    types: ["registry", "fbc"]
    environments: ["prod", "stage"]

# FBC detection: component name contains 'fbc' (case-insensitive)
fbc_detection_pattern: "(?i)fbc"

# Self-service eligible rules (auto-detected from exception_templates.yaml workflow)
self_service_rules:
  - schedule.weekday_restriction
  - "test.no_failed_tests:fbc-target-index-pruning-check"
