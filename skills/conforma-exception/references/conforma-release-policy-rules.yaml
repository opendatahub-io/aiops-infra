# Full list of enforced rules in the Conforma 'redhat' collection.
#
# Source: https://conforma.dev/docs/policy/release_policy.html
#
# Each entry has the rule code used in Conforma violation reports
# and the human-readable display name. The rule code is what appears
# in --rule flags and in exception YAML `value:` fields.
#
# Rules with a colon suffix (e.g. rpm_signature.allowed:<key>) accept a
# dynamic value after the colon; the base code is listed here.
#
# When the user provides a rule that does NOT match a templated category
# in exception_templates.yaml, the agent should look up the rule here
# to confirm it is a real Conforma rule and use the display name and
# docs URL to help the user fill in the exception details.

source_url: https://conforma.dev/docs/policy/release_policy.html
collection: redhat

