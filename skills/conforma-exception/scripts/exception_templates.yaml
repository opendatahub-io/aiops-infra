  # -----------------------------------------------------------------------
  # Catch-all for any Conforma rule not covered by a specific category above.
  #
  # This category is ONLY matched by explicit fallback logic in
  # match_template_category() when no other category's matches_rules
  # patterns match. It is NOT matched via glob — it must be the last resort.
  #
  # Because there is no pre-written template text for unknown violations,
  # the agent MUST interactively gather all exception text fields from the
  # user (scope, risk, remediation, impact, summary_context). The agent
  # uses references/conforma-release-policy-rules.yaml to validate the
  # rule code and provide the user with the official rule name and docs URL.
  #
  # Workflow: uses the standard 4-step PSX path by default. The agent may
  # present the user with the option to switch to OCPEXCEPT or self-service
  # if the rule warrants it, but PSX is the safe default.
  # -----------------------------------------------------------------------
  other:
    display_name: "Other Conforma violation (non-templated)"
    is_catch_all: true
    matches_rules: []
    workflow:
      - step: rhoaieng_resolution_plan_jira
        track: remediation_plan
        project: RHOAIENG
        issue_type: bug
        purpose: "RHOAIENG Jira resolution plan — documents the fix commitment with a future target date"
        assignee_role: component_team
      - step: rhoaieng_approval_jira
        track: exception_approval
        project: RHOAIENG
        issue_type: blocker_bug
        purpose: "RHOAIENG Jira exception approval request — requires Senior Management approval to proceed"
        default_assignee: "Jay Koehler"
      - step: psx_exception_jira
        track: exception_approval
        project: PSX
        issue_type: psrd_exception
        purpose: "PSX Jira — ProdSec exception review"
      - step: exception_merge_request
        track: exception_approval
        purpose: "GitLab Merge Request to add the exception to the release policy"
    summary_context: "{rule} exception"
    violation_summary: >-
      Conforma policy violation: {rule}
    applicable_justifications:
      - code_frozen
      - dev_preview
      - tooling_limitation
      - upstream_dependency
      - infrastructure_delay
    scope: >-
      USER_PROVIDED
    risk: >-
      USER_PROVIDED
    remediation: >-
      USER_PROVIDED
    impact: >-
      Without exception, Conforma blocks release pipeline gates for {versions}.
      Affected components cannot ship.
    find_examples:
      jira_search: "https://redhat.atlassian.net/issues/?jql=labels%20%3D%20%22conforma-violation%22%20ORDER%20BY%20created%20DESC"
      gitlab_mr_search: "https://${GITLAB_HOST}/releng/konflux-release-data/-/merge_requests?state=all&sort=created_desc"
    example_tickets: []
    reference_docs:
      - url: "https://conforma.dev/docs/policy/release_policy.html"
        note: "Full Conforma release policy — all rule collections and rule definitions"
      - url: "https://conforma.dev/docs/policy/packages/release_volatile_config.html"
        note: "VolatileCriteria schema (effectiveUntil, componentNames, etc.)"
