# Deterministic templates for Conforma exception text fields and workflow routing.
#
# Each category maps to a rule pattern and provides:
#   1. workflow — ordered list of Jira/MR steps the orchestrator executes
#   2. template text — scope, risk, remediation, impact fields with placeholders
#   3. find_examples — pre-built search URLs for Jira tickets and GitLab MRs (not used by code)
#   4. example_tickets — historical Jira+MR pairs created before the conforma-exception AI skill (not used by code)
#   5. reference_examples — past real-world cases for human reference (not used by code)
#
# Workflow step schema:
#   - step: step ID
#     track: remediation_plan | exception_approval
#     project: Jira project key (RHOAIENG, PSX, OCPEXCEPT)
#     issue_type: blocker_bug | bug | psrd_exception | task
#     purpose: human-readable description of this step
#     default_assignee: Jira display name (optional)
#     assignee_role: component_team (resolved at runtime, optional)
#     self_service: true (for exception_merge_request step targeting exceptions/ dir, optional)
#
# Track values:
#   remediation_plan    — fix commitment ticket, created first; its URL feeds into all
#                         downstream justification text via {remediation_plan_url}
#   exception_approval  — steps on the blocking exception approval chain
#                         (approval -> PSX/OCPEXCEPT -> GitLab MR)
#
# Step IDs:
#   rhoaieng_resolution_plan_jira — RHOAIENG ticket documenting the fix commitment (created first)
#   rhoaieng_approval_jira        — RHOAIENG Jira ticket to get approval for the exception
#   psx_exception_jira            — PSX/OCPEXCEPT Jira ticket for ProdSec exception review
#   exception_merge_request       — GitLab Merge Request to add the exception to the release policy
#
# Template variables (auto-filled by resolve_template()):
#   {rule}            — full rule value (e.g., rpm_signature.allowed:8a3872bf3228467c)
#   {rule_key}        — key portion after colon (e.g., 8a3872bf3228467c)
#   {components}      — comma-separated Konflux component names
#   {component_count} — number of components
#   {versions}        — comma-separated RHOAI versions
#   {version_count}   — number of versions
#   {vendor}          — vendor name provided via --vendor-tag (e.g., AMD, Intel, Fedora/EPEL)
#   {rhoaieng_exception_approval_url} — RHOAIENG exception approval ticket URL
#   {remediation_plan_url}            — RHOAIENG resolution plan ticket URL
#   {psx_url}         — PSX ticket URL
#   {effective_until} — expiry date
#
# The template text uses {vendor} as a placeholder for any third-party name.
# The actual vendor name is provided at runtime via --vendor-tag. The --exception-scope,
# --exception-risk, --exception-remediation, --exception-impact CLI flags override the
# template text when more specific wording is needed for a particular case.
#
# Justification templates (top-level `justifications` section):
#   Reusable risk + remediation text blocks. Each category lists its
#   `applicable_justifications` (ordered, first = default). The selected
#   justification's risk/remediation text uses {violation_summary} from the
#   category as a placeholder.
#
# Additional template variable (justification-specific):
#   {violation_summary} — short per-category description injected into justification text

justifications:
  dev_preview:
    display_name: "Component in Dev Preview / Tech Preview"
    risk: >-
      {violation_summary} for a Dev Preview / Tech Preview component.
      Acceptable because this maturity level does not require full
      compliance; the fix is planned for the GA release.
    remediation: >-
      Component team to resolve the violation before the component
      graduates to GA. Tracked in {remediation_plan_url}.

  code_frozen:
    display_name: "Code-frozen release (fix deferred)"
    risk: >-
      {violation_summary} in a code-frozen release. Acceptable because
      major changes are not permitted in z-stream releases. The
      violation existed before code-freeze.
    remediation: >-
      Fix planned for the next RHOAI release cycle. Exception needed
      for the duration of the current release support lifecycle.
      Tracked in {remediation_plan_url}.

  tooling_limitation:
    display_name: "Build tooling limitation"
    risk: >-
      {violation_summary} due to a known limitation in the build
      tooling. Acceptable because the root cause is a tooling issue
      being addressed by the build team, not a component decision.
    remediation: >-
      Blocked on build tooling fix. Will be resolved once the
      tooling issue is addressed. Tracked in {remediation_plan_url}.

  vendor_dependency:
    display_name: "Vendor/partner package dependency"
    risk: >-
      {violation_summary}. Acceptable because {vendor} is a trusted
      partner providing packages required for hardware/software
      enablement that are not available from Red Hat repositories.
    remediation: >-
      Exception required while formal agreement or package onboarding
      with {vendor} is being arranged. Tracked in {remediation_plan_url}.

  upstream_dependency:
    display_name: "Upstream dependency (not available from Red Hat)"
    risk: >-
      {violation_summary}. Acceptable because the upstream project
      distributes only from their own infrastructure and no
      Red Hat-managed alternative exists.
    remediation: >-
      Component team to explore mirroring or onboarding the
      dependency. If not feasible, exception maintained for the
      release lifecycle. Tracked in {remediation_plan_url}.

  infrastructure_delay:
    display_name: "Infrastructure delay (scan/proxy/tooling not ready)"
    risk: >-
      {violation_summary}. Acceptable as a temporary measure because
      the required infrastructure is not yet available or has a
      known delay.
    remediation: >-
      Infrastructure team to resolve the issue. Short-term exception
      to unblock the release. Tracked in {remediation_plan_url}.

  operational_urgency:
    display_name: "Time-critical operational action"
    risk: >-
      {violation_summary}. Acceptable because the action is
      time-critical and on-call support is available to handle
      any issues.
    remediation: >-
      One-time exception for this release window. Future actions
      will follow the standard process. Tracked in {remediation_plan_url}.

  fips_certification_pending:
    display_name: "Component not yet FIPS compliant"
    risk: >-
      {violation_summary}. Acceptable because the component is not
      yet compliant with FIPS requirements and the current release
      timeline cannot accommodate the full compliance work.
    remediation: >-
      FIPS compliance work is tracked separately. Components will
      be updated as compliance is achieved. Tracked in
      {remediation_plan_url}.

categories:
  rpm_signature_thirdparty:
    display_name: "Third-party RPM signing key"
    common: true
    matches_rules:
      - "rpm_signature.allowed:*"
    workflow:
      - step: rhoaieng_resolution_plan_jira
        track: remediation_plan
        project: RHOAIENG
        issue_type: bug
        purpose: "RHOAIENG Jira resolution plan — documents the fix commitment with a future target date"
        assignee_role: component_team
      - step: rhoaieng_approval_jira
        track: exception_approval
        project: RHOAIENG
        issue_type: blocker_bug
        purpose: "RHOAIENG Jira exception approval request — requires Senior Management approval to proceed"
        default_assignee: "Jay Koehler"
      - step: psx_exception_jira
        track: exception_approval
        project: PSX
        issue_type: psrd_exception
        purpose: "PSX Jira — ProdSec exception review"
      - step: exception_merge_request
        track: exception_approval
        purpose: "GitLab Merge Request to add the exception to the release policy"
    summary_context: "{vendor} RPM signing key exception"
    violation_summary: >-
      RPMs signed with {vendor} key ({rule_key}) instead of Red Hat key
    applicable_justifications:
      - vendor_dependency
      - dev_preview
      - code_frozen
    scope: >-
      Container component(s) {components} include RPMs signed with {vendor} GPG
      key ({rule_key}) rather than a Red Hat key. {component_count} component(s)
      affected across {version_count} RHOAI version(s): {versions}.
    impact: >-
      Without exception, Conforma blocks release pipeline gates for {versions}.
      Z-stream security fixes and GA releases cannot ship for affected components.
    find_examples:
      jira_search: "https://redhat.atlassian.net/issues/?jql=labels%20%3D%20%22conforma-violation%22%20AND%20summary%20~%20%22rpm_signature.allowed%22%20ORDER%20BY%20created%20DESC"
      gitlab_mr_search: "https://${GITLAB_HOST}/releng/konflux-release-data/-/merge_requests?search=rpm_signature.allowed&state=all"
    example_tickets:  # pre-skill (created before conforma-exception AI skill)
      - jira: "https://redhat.atlassian.net/browse/RHOAIENG-38427"
        mr: "https://${GITLAB_HOST}/releng/konflux-release-data/-/merge_requests/18328"
        note: "Habanalabs(Intel) RPM signing key exception for rhoai-2.25..rhoai-3.3"
      - jira: "https://redhat.atlassian.net/browse/PSX-1101"
        mr: "https://${GITLAB_HOST}/releng/konflux-release-data/-/merge_requests/18291"
        note: "Fedora/EPEL RPM signing key exception for rhoai-3.5-ea.1"
    reference_examples:
      - vendor: "Fedora/EPEL"
        note: "Trusted upstream community packages"
      - vendor: "AMD"
        note: "GPU/accelerator driver packages for hardware enablement"
      - vendor: "Intel/CentOS"
        note: "OpenVINO, oneAPI hardware enablement packages"
      - vendor: "Mellanox"
        note: "RDMA and high-performance networking for distributed AI workloads"
      - vendor: "Habanalabs (Intel)"
        note: "Gaudi accelerator driver and firmware packages"
      - vendor: "CentOS"
        note: "Standard CentOS community packages (boost, gcc, perl, valgrind)"

