# Authoritative RHOAI release end-of-support dates.
# Source: rhods-devops-infra/rhoai-release-data.yaml
#
# This is the single canonical source for EOS dates shared across all conforma skills.
# Loaded at runtime by scripts/release_dates.py via get_eos_date() / get_effective_until().
# The agent MUST NOT hardcode, guess, or infer these dates.
#
# support_end: the date after which the release is no longer supported (YYYY-MM-DD).
# Used as the default effectiveUntil for Conforma exceptions (with a +7 day buffer).
# The user may override with a different date (e.g. a bug fix due date).
#
# Future: support_end may be fetched dynamically via _fetch_dynamic() in release_dates.py.
# Until then, keep this file up to date when new releases are cut.

