[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-infra"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-gitlab>=4.0",
    "jira>=3.8",
    "ruamel.yaml>=0.18",
    "requests>=2.31",
    "PyYAML>=6.0",
    "slack_sdk>=3.27",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "pre-commit>=3.7", "responses>=0.25", "jsonschema>=4.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: marks tests requiring real API access"]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.coverage.run]
source = ["scripts", "skills"]
